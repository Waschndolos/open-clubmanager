openapi: 3.1.0
info:
  title: Open ClubManager REST API
  version: 2.0.0
  summary: Versioned REST API for Open ClubManager
  description: |
    OpenAPI specification for the currently implemented REST API under `/api/v2`.

    Notes:
    - The legacy `/api/*` v1 endpoints were removed.
    - Authentication uses bearer access tokens for protected endpoints.
    - Refresh/logout use an HTTP-only cookie named `refreshToken`.
servers:
  - url: http://localhost:3001/api/v2
    description: Local development server

tags:
  - name: system
  - name: setup
  - name: auth
  - name: users
  - name: members
  - name: roles
  - name: groups
  - name: sections
  - name: preferences
  - name: validation
  - name: settings
  - name: statistics
  - name: finance
  - name: history

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refreshToken

  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          examples: [INTERNAL_ERROR, MEMBER_VERSION_CONFLICT]
        error:
          type: string
      required: [error]
      additionalProperties: false

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: open-clubmanager-api-v2
      required: [status, service]
      additionalProperties: false

    MetaResponse:
      type: object
      properties:
        apiVersion:
          type: string
          const: v2
        usesLegacyJwtFallback:
          type: boolean
        now:
          type: string
          format: date-time
      required: [apiVersion, usesLegacyJwtFallback, now]
      additionalProperties: false

    DatabaseMode:
      type: string
      enum: [sqlite-local, mysql-shared]

    SetupStatus:
      type: object
      properties:
        setupRequired:
          type: boolean
        userCount:
          type: integer
        databaseConfigured:
          type: boolean
        databaseMode:
          $ref: '#/components/schemas/DatabaseMode'
      required: [setupRequired, userCount, databaseConfigured, databaseMode]
      additionalProperties: false

    ConfigureDatabaseRequest:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/DatabaseMode'
        databaseUrl:
          type: string
      required: [mode]
      additionalProperties: false

    ConfigureDatabaseResponse:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/DatabaseMode'
        databaseUrl:
          type: string
      required: [mode, databaseUrl]
      additionalProperties: false

    DatabaseSettingsRequest:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/DatabaseMode'
        databaseUrl:
          type: string
      required: [mode, databaseUrl]
      additionalProperties: false

    SetupInitializeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [email, password]
      additionalProperties: false

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
      additionalProperties: false

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]
      additionalProperties: false

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]
      additionalProperties: false

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [token, newPassword]
      additionalProperties: false

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
      additionalProperties: false

    AccessTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
      required: [accessToken]
      additionalProperties: false

    AppRole:
      type: string
      enum: [ADMIN, TREASURER, SECRETARY, READONLY]

    UserProfile:
      type: object
      properties:
        email:
          type: string
          format: email
        appRole:
          $ref: '#/components/schemas/AppRole'
      required: [email]
      additionalProperties: false

    AppUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        appRole:
          $ref: '#/components/schemas/AppRole'
        createdAt:
          type: string
          format: date-time
      required: [id, email, appRole, createdAt]
      additionalProperties: false

    CreateAppUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        appRole:
          $ref: '#/components/schemas/AppRole'
      required: [email, password, appRole]
      additionalProperties: false

    UpdateAppUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        appRole:
          $ref: '#/components/schemas/AppRole'
      additionalProperties: false

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [newPassword]
      additionalProperties: false

    NamedEntity:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required: [id, name]
      additionalProperties: true

    NamedEntityReference:
      type: object
      properties:
        id:
          type: integer
      required: [id]
      additionalProperties: false

    NamedEntityCreateRequest:
      type: object
      properties:
        name:
          type: string
      required: [name]
      additionalProperties: false

    NamedEntityUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/NamedEntityCreateRequest'

    BulkMemberAssignRequest:
      type: object
      properties:
        memberIds:
          type: array
          items:
            type: integer
      required: [memberIds]
      additionalProperties: false

    Member:
      type: object
      properties:
        id:
          type: integer
        versionToken:
          type: string
        number:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        birthday:
          type:
            - string
            - 'null'
          format: date-time
        phone:
          type:
            - string
            - 'null'
        phoneMobile:
          type:
            - string
            - 'null'
        comment:
          type:
            - string
            - 'null'
        entryDate:
          type:
            - string
            - 'null'
          format: date-time
        exitDate:
          type:
            - string
            - 'null'
          format: date-time
        street:
          type:
            - string
            - 'null'
        postalCode:
          type:
            - string
            - 'null'
        city:
          type:
            - string
            - 'null'
        state:
          type:
            - string
            - 'null'
        accountHolder:
          type:
            - string
            - 'null'
        iban:
          type:
            - string
            - 'null'
        bic:
          type:
            - string
            - 'null'
        bankName:
          type:
            - string
            - 'null'
        sepaMandateDate:
          type:
            - string
            - 'null'
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/NamedEntity'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/NamedEntity'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/NamedEntity'
      required:
        - id
        - number
        - firstName
        - lastName
        - email
        - roles
        - groups
        - sections
      additionalProperties: false

    MemberCreateRequest:
      type: object
      properties:
        number:
          type: integer
          minimum: 1
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        birthday:
          type:
            - string
            - 'null'
          format: date-time
        phone:
          type:
            - string
            - 'null'
        phoneMobile:
          type:
            - string
            - 'null'
        comment:
          type:
            - string
            - 'null'
        entryDate:
          type:
            - string
            - 'null'
          format: date-time
        exitDate:
          type:
            - string
            - 'null'
          format: date-time
        street:
          type:
            - string
            - 'null'
        postalCode:
          type:
            - string
            - 'null'
        city:
          type:
            - string
            - 'null'
        state:
          type:
            - string
            - 'null'
        accountHolder:
          type:
            - string
            - 'null'
        iban:
          type:
            - string
            - 'null'
        bic:
          type:
            - string
            - 'null'
        bankName:
          type:
            - string
            - 'null'
        sepaMandateDate:
          type:
            - string
            - 'null'
          format: date-time
        roleIds:
          type: array
          items:
            type: integer
        groupIds:
          type: array
          items:
            type: integer
        sectionIds:
          type: array
          items:
            type: integer
        roles:
          type: array
          items:
            $ref: '#/components/schemas/NamedEntityReference'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/NamedEntityReference'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/NamedEntityReference'
      required: [number, firstName, lastName, email]
      additionalProperties: false

    MemberUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/MemberCreateRequest'
        - type: object
          properties:
            expectedVersionToken:
              type: string
          required: [expectedVersionToken]
          additionalProperties: false

    MembersListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required: [items, page, pageSize, total, totalPages]
      additionalProperties: false

    UserPreferenceRecord:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        key:
          type: string
        value:
          type: string
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, key, value, updatedAt]
      additionalProperties: false

    UserPreferenceValueResponse:
      type: object
      properties:
        key:
          type: string
        value:
          description: Parsed JSON value stored in the preference entry.
        updatedAt:
          type: string
          format: date-time
      required: [key, value, updatedAt]
      additionalProperties: false

    UpsertUserPreferenceRequest:
      type: object
      properties:
        key:
          type: string
        value:
          description: Any JSON-serializable value.
      required: [key, value]
      additionalProperties: false

    UpdateUserPreferenceRequest:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
      required: [key, value]
      additionalProperties: false

    AppPreferences:
      type: object
      additionalProperties: true

    UpdateAppPreferenceRequest:
      type: object
      properties:
        value:
          description: Any JSON-serializable value.
      required: [value]
      additionalProperties: false

    ValidationRequest:
      type: object
      properties:
        path:
          type: string
      required: [path]
      additionalProperties: false

    ValidationDatabaseUrlRequest:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/DatabaseMode'
        databaseUrl:
          type: string
      required: [mode, databaseUrl]
      additionalProperties: false

    ValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
        i18nToken:
          type: string
      required: [valid]
      additionalProperties: false

    SetDbPathRequest:
      type: object
      properties:
        dbPath:
          type: string
      required: [dbPath]
      additionalProperties: false

    SetDbPathResponse:
      type: object
      properties:
        status:
          type: string
        dbPath:
          type: string
      required: [status]
      additionalProperties: false

    DbPathResponse:
      type: object
      properties:
        dbPath:
          type:
            - string
            - 'null'
      required: [dbPath]
      additionalProperties: false

    DatabaseSettings:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/DatabaseMode'
        databaseUrl:
          type: string
      required: [mode, databaseUrl]
      additionalProperties: false

    Statistic:
      type: object
      properties:
        id:
          type: integer
        value:
          type: integer
        details:
          type: array
          items:
            type: string
      required: [id, value]
      additionalProperties: false

    FinanceTransaction:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
          format: date-time
        description:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [income, expense]
        category:
          type:
            - string
            - 'null'
        notes:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, date, description, amount, type, createdAt, updatedAt]
      additionalProperties: false

    FinanceTransactionCreateRequest:
      type: object
      properties:
        date:
          type: string
          format: date-time
        description:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [income, expense]
        category:
          type:
            - string
            - 'null'
        notes:
          type:
            - string
            - 'null'
      required: [date, description, amount, type]
      additionalProperties: false

    FinanceTransactionUpdateRequest:
      type: object
      properties:
        date:
          type: string
          format: date-time
        description:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [income, expense]
        category:
          type:
            - string
            - 'null'
        notes:
          type:
            - string
            - 'null'
      additionalProperties: false

    Camt053ImportRequest:
      type: object
      properties:
        xml:
          type: string
          description: Raw CAMT.053 XML content.
      required: [xml]
      additionalProperties: false

    Camt053ImportResponse:
      type: object
      properties:
        importedCount:
          type: integer
          minimum: 0
        skippedCount:
          type: integer
          minimum: 0
        totalCount:
          type: integer
          minimum: 0
        matchedMemberCount:
          type: integer
          minimum: 0
        memberFeesMarkedPaid:
          type: integer
          minimum: 0
        memberFeesCreated:
          type: integer
          minimum: 0
      required: [importedCount, skippedCount, totalCount, matchedMemberCount, memberFeesMarkedPaid, memberFeesCreated]
      additionalProperties: false

    FinanceResetRequest:
      type: object
      properties:
        confirmation:
          type: string
          const: DELETE_KASSENBUCH
      required: [confirmation]
      additionalProperties: false

    FinanceResetResponse:
      type: object
      properties:
        deletedMemberFees:
          type: integer
          minimum: 0
        deletedTransactions:
          type: integer
          minimum: 0
      required: [deletedMemberFees, deletedTransactions]
      additionalProperties: false

    MemberSummary:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        number:
          type: integer
      required: [id, firstName, lastName, number]
      additionalProperties: false

    MemberFee:
      type: object
      properties:
        id:
          type: integer
        memberId:
          type: integer
        amount:
          type: number
        dueDate:
          type: string
          format: date-time
        paidDate:
          type:
            - string
            - 'null'
          format: date-time
        description:
          type:
            - string
            - 'null'
        year:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        member:
          anyOf:
            - $ref: '#/components/schemas/MemberSummary'
            - type: 'null'
      required: [id, memberId, amount, dueDate, year, createdAt, updatedAt, member]
      additionalProperties: false

    MemberFeeCreateRequest:
      type: object
      properties:
        memberId:
          type: integer
        amount:
          type: number
        dueDate:
          type: string
          format: date-time
        paidDate:
          type:
            - string
            - 'null'
          format: date-time
        description:
          type:
            - string
            - 'null'
        year:
          type: integer
      required: [memberId, amount, dueDate, year]
      additionalProperties: false

    MemberFeeUpdateRequest:
      type: object
      properties:
        memberId:
          type: integer
        amount:
          type: number
        dueDate:
          type: string
          format: date-time
        paidDate:
          type:
            - string
            - 'null'
          format: date-time
        description:
          type:
            - string
            - 'null'
        year:
          type: integer
      additionalProperties: false

    AuditLog:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
          enum: [CREATE, UPDATE, DELETE]
        entity:
          type: string
        entityId:
          type: integer
        userId:
          type: string
        data:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
      required: [id, action, entity, entityId, userId, createdAt]
      additionalProperties: false

  responses:
    NoContent:
      description: Request completed successfully. No response body is returned.
    BadRequest:
      description: Invalid request payload or query parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not allowed, or refresh token invalid/expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with current server state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server-side error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /system/health:
    get:
      tags: [system]
      summary: Health check
      operationId: getSystemHealth
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /system/meta:
    get:
      tags: [system]
      summary: API metadata
      operationId: getSystemMeta
      responses:
        '200':
          description: API metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'

  /setup/status:
    get:
      tags: [setup]
      summary: Get setup status
      operationId: getSetupStatus
      responses:
        '200':
          description: Current setup status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
        '500':
          $ref: '#/components/responses/InternalError'

  /setup/configure-database:
    post:
      tags: [setup]
      summary: Configure the initial database mode and URL
      operationId: configureSetupDatabase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureDatabaseRequest'
      responses:
        '200':
          description: Database configuration stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigureDatabaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /setup/initialize:
    post:
      tags: [setup]
      summary: Create the initial admin user
      operationId: initializeSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupInitializeRequest'
      responses:
        '201':
          description: Initial admin user created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token returned and refresh cookie set.
          headers:
            Set-Cookie:
              description: HTTP-only `refreshToken` cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh-token:
    post:
      tags: [auth]
      summary: Refresh the access token
      operationId: refreshAccessToken
      security:
        - refreshTokenCookie: []
      responses:
        '200':
          description: New access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [auth]
      summary: Log out and clear refresh token cookie
      operationId: logout
      security:
        - refreshTokenCookie: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request a password reset email
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset email sent (always returns 200 to prevent email enumeration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Reset password using a valid reset token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/change-password:
    post:
      tags: [auth]
      summary: Change the current user's password
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/profile:
    get:
      tags: [auth]
      summary: Get the current authenticated user profile
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /members:
