name: Docs screenshots

# Regenerates the screenshots of the user documentation from the current app,
# commits them straight to main when they changed and republishes the docs in
# the same go. The browser clock is frozen, so only real UI changes produce a
# diff.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'server/**'
      - 'scripts/docs-screenshots/**'
      - '.github/workflows/docs-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: docs-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            scripts/docs-screenshots/package-lock.json

      - name: Install dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix scripts/docs-screenshots ci
          npx --prefix scripts/docs-screenshots playwright install --with-deps chromium-headless-shell

      - name: Capture screenshots
        env:
          TZ: Europe/Berlin
        run: bash scripts/docs-screenshots/run.sh

      - name: Check that every screenshot is documented
        run: python3 scripts/check_docs_coverage.py

      - name: Commit updated screenshots
        id: commit
        run: |
          git add docs/user/assets/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'docs: update screenshots of the user documentation'
          # main may have moved on while the screenshots were captured.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the docs
      # are republished explicitly.
      - name: Publish documentation
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
