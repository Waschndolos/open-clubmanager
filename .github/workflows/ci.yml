name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/server

  prisma-tooling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: db
    env:
      DATABASE_URL: "file:./clubmanager.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: db/package-lock.json

      - name: Install db dependencies
        run: npm ci

      - name: Validate Prisma schemas
        run: npm run prisma:validate

      - name: Push Prisma schema
        run: npx prisma db push --schema prisma/schema.prisma --skip-generate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
