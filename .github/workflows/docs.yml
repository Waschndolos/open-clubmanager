name: Docs

# Builds the user documentation (MkDocs, docs/user/) together with the API
# reference (ReDoc, served under /api/) and publishes both to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'openapi.yaml'
      - 'frontend/src/routes/routes.tsx'
      - 'scripts/generate_redoc.py'
      - 'scripts/check_docs_coverage.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: python -m pip install -r docs/requirements.txt pyyaml

      - name: Check documentation coverage
        run: python3 scripts/check_docs_coverage.py

      - name: Build user documentation
        run: mkdocs build --strict

      - name: Add API reference
        run: |
          python3 scripts/generate_redoc.py
          mkdir -p site/api
          cp docs/index.html docs/openapi.yaml site/api/
          touch site/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
