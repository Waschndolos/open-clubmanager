template: |
  ## 🚀 What's New in this Release

  $CHANGES

  📖 User guide: https://waschndolos.github.io/open-clubmanager/en/ (Deutsch: https://waschndolos.github.io/open-clubmanager/) · Update notes: https://waschndolos.github.io/open-clubmanager/en/migration/versionshinweise/

name-template: 'Release v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: ⚠️ Manual steps needed when updating
    labels:
      - breaking-change
  - title: 🚀 Features
    labels:
      - feature
  - title: 🐛 Bug Fixes
    labels:
      - bug
  - title: 🧰 Maintenance
    labels:
      - chore

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'

include-issues: true
only-issues-with-labels: true

exclude-labels:
  - chore
